<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentBridge</title>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warn: #d97706;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 380px;
      min-height: 480px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 13px;
      line-height: 1.5;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 600;
      font-size: 15px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      background: var(--text);
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      background: #f1f5f9;
      color: var(--muted);
    }
    .badge.online {
      background: #dcfce7;
      color: #15803d;
    }
    .badge.offline {
      background: #fee2e2;
      color: #b91c1c;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor;
    }
    .section {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
    }
    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .row + .row {
      margin-top: 12px;
    }
    .label-title {
      font-weight: 500;
      color: var(--text);
    }
    .label-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
    }
    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background-color: #cbd5e1;
      transition: 0.2s;
      border-radius: 22px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 16px;
      width: 16px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: 0.2s;
      border-radius: 50%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
    }
    input:checked + .slider {
      background-color: var(--accent);
    }
    input:checked + .slider:before {
      transform: translateX(18px);
    }
    .meta-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      margin-top: 10px;
      font-size: 11.5px;
      color: var(--muted);
    }
    .meta-box code {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--text);
      user-select: all;
    }
    .btn {
      border: 1px solid var(--border);
      background: #fff;
      color: var(--text);
      border-radius: 6px;
      padding: 5px 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn:hover {
      background: var(--surface);
    }
    .audit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .audit-list {
      max-height: 190px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .audit-item {
      padding: 7px 10px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11.5px;
    }
    .audit-item-top {
      display: flex;
      justify-content: space-between;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-weight: 600;
      margin-bottom: 2px;
    }
    .audit-item.blocked {
      border-color: #fde68a;
      background: #fffbeb;
    }
    .audit-item.error {
      border-color: #fecaca;
      background: #fef2f2;
    }
    .empty {
      color: var(--muted);
      text-align: center;
      padding: 18px 0;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <span class="brand-icon">AB</span>
      <span>AgentBridge</span>
    </div>
    <span id="connBadge" class="badge offline">
      <span class="dot"></span>
      <span id="connText">未连接宿主</span>
    </span>
  </div>

  <div class="section">
    <div class="row">
      <div>
        <div id="masterStatusLabel" class="label-title">已启用</div>
        <div class="label-desc">Control your browser with AI Agents.</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleEnabled" checked />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="section">
    <div class="row">
      <div>
        <div class="label-title">Developer Mode (Full CDP)</div>
        <div class="label-desc">开启 Network 抓包、Console 异常追踪与底层 CDP 访问</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleDevMode" />
        <span class="slider"></span>
      </label>
    </div>

    <div class="row">
      <div>
        <div class="label-title">敏感动作提交前拦截确认</div>
        <div class="label-desc">自动识别表单提交、发送、删除与支付按钮并暂停确认</div>
      </div>
      <label class="switch">
        <input type="checkbox" id="toggleConfirmSubmit" checked />
        <span class="slider"></span>
      </label>
    </div>

    <div class="meta-box">
      <div class="row">
        <span>Extension ID: <code id="extIdCode">-</code></span>
        <button id="btnReconnect" class="btn">重连宿主</button>
      </div>
      <div id="nativeErrorBox" style="margin-top: 6px; display: none; color: #b91c1c;"></div>
    </div>
  </div>

  <div class="section" style="border-bottom: none;">
    <div class="audit-header">
      <span>实时操作审计流</span>
      <span id="attachedCount">0 个调试标签</span>
    </div>
    <div id="auditList" class="audit-list">
      <div class="empty">暂无 Agent 操作记录</div>
    </div>
  </div>

  <script type="module" src="panel.js"></script>
</body>
</html>
